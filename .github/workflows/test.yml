name: Test Find Lowest Number Application

on:
  push:
    branches: [ "**" ]

jobs:
  run-tests:
    name: Run Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Test Case 1 (10 Numbers)
        run: |
          python3 find_lowest_number.py test_data/test1_input.txt test_data/test1_actual.txt
          diff test_data/test1_actual.txt test_data/test1_expected.txt

      - name: Run Test Case 2 (1 Number)
        run: |
          python3 find_lowest_number.py test_data/test2_input.txt test_data/test2_actual.txt
          diff test_data/test2_actual.txt test_data/test2_expected.txt

      - name: Run Test Case 3 (Blank File)
        run: |
          python3 find_lowest_number.py test_data/test3_input.txt test_data/test3_actual.txt
          diff test_data/test3_actual.txt test_data/test3_expected.txt
